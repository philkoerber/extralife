name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: cargo test (headless cores + contract checks)
        run: cargo test --workspace
      - name: cargo build --release for wasm target
        run: cargo build --workspace --release --target wasm32-unknown-unknown

  js:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      # pnpm before setup-node so setup-node's package-manager cache can find it.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install wasm-pack
        run: cargo install wasm-pack --version 0.15.0 --locked
      - run: pnpm install --frozen-lockfile
      - name: Build publishable JavaScript, declarations, and WASM
        run: pnpm --filter @philkoerber/extralife build
      - run: pnpm -r typecheck
      - name: vitest (headless harness + input contract)
        run: pnpm -r test
      - run: pnpm exec playwright install --with-deps chromium
      - name: Test actual npm tarball in an isolated browser app
        run: node scripts/test-package.mjs
